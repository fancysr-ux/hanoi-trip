<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B83227">
<title>河內跨年自由行 12/31–1/4</title>
<style>
  :root{
    --red:#B83227; --red-d:#8E2219; --gold:#E3A72F; --jade:#2F7D6D;
    --ink:#23262E; --muted:#6B7280; --line:#ECE6DC; --bg:#F7F3EC; --card:#FFFFFF;
    --ok:#2F7D6D; --ok-bg:#E3F2EE; --warn:#B26A00; --warn-bg:#FFF2DB; --todo:#7A4BC2; --todo-bg:#F0E9FB;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
       background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
  .wrap{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg)}
  /* header */
  header.top{background:var(--red);color:#fff;padding:18px 18px 14px;position:relative;overflow:hidden}
  header.top h1{margin:0;font-size:22px;letter-spacing:.5px}
  header.top .sub{opacity:.9;font-size:13px;margin-top:2px}
  header.top .count{display:inline-block;margin-top:10px;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 12px;font-size:13px}
  header.top svg.deco{position:absolute;right:-10px;top:-6px;width:150px;opacity:.22}
  /* tabs */
  nav.tabs{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
           display:flex;overflow-x:auto;scrollbar-width:none;padding:0 6px}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex:0 0 auto;border:0;background:none;padding:11px 12px 9px;font:inherit;color:var(--muted);
                  border-bottom:3px solid transparent;cursor:pointer;text-align:center;line-height:1.25}
  nav.tabs button b{display:block;font-size:14px;color:inherit}
  nav.tabs button small{font-size:11px}
  nav.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
  nav.tabs button.on b{color:var(--red)}
  /* day hero */
  .hero{margin:14px 14px 6px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .hero .art{aspect-ratio:400/190;overflow:hidden}
  .hero .art svg{width:100%;height:100%;display:block}
  .hero .txt{padding:12px 16px 14px}
  .hero h2{margin:0;font-size:19px}
  .hero p{margin:4px 0 0;color:var(--muted);font-size:13px}
  .hero .stay{margin-top:8px;font-size:13px;background:var(--bg);border-radius:10px;padding:7px 10px}
  /* section */
  .sec{margin:16px 14px 4px;font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
  .sec:after{content:"";flex:1;height:1px;background:var(--line)}
  /* timeline */
  .tl{list-style:none;margin:0;padding:4px 14px 6px;position:relative}
  .tl li{display:flex;gap:10px;margin:0 0 10px}
  .tl .time{flex:0 0 52px;text-align:right;font-size:13px;font-weight:700;color:var(--red);padding-top:12px;line-height:1.2}
  .tl .time small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .item{flex:1;min-width:0;display:flex;gap:10px;align-items:stretch;background:var(--card);border-radius:14px;padding:10px;
        box-shadow:0 1px 2px rgba(0,0,0,.05);border:1px solid var(--line);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
  .item:active{transform:scale(.99)}
  .item .body{flex:1;min-width:0}
  .item h3{margin:0;font-size:15px;line-height:1.35}
  .item .vn{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .thumb{flex:0 0 74px;height:62px;border-radius:10px;overflow:hidden;background:#eee}
  .item .thumb svg{width:100%;height:100%;display:block}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .chip{font-size:11.5px;border-radius:999px;padding:1px 8px;background:var(--bg);color:var(--ink);white-space:nowrap}
  .chip.cost{background:#FFF6E0;color:#8A5A00}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.tbd{background:var(--warn-bg);color:var(--warn)}
  .chip.todo{background:var(--todo-bg);color:var(--todo)}
  /* checklist */
  .card{margin:8px 14px;background:#fff;border-radius:14px;border:1px solid var(--line);padding:6px 14px}
  .check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
  .check:last-child{border-bottom:0}
  .check input{width:20px;height:20px;margin-top:2px;accent-color:var(--jade);flex:0 0 auto}
  .check label{flex:1}
  .check label small{display:block;color:var(--muted);font-size:12px}
  .check input:checked + label{color:var(--muted);text-decoration:line-through}
  table.cost{width:100%;border-collapse:collapse;font-size:13.5px}
  table.cost td{padding:7px 0;border-bottom:1px dashed var(--line);vertical-align:top}
  table.cost td:last-child{text-align:right;white-space:nowrap;padding-left:10px;font-weight:600}
  table.cost tr:last-child td{border-bottom:0}
  .note{font-size:12px;color:var(--muted);margin:6px 16px 0}
  footer{padding:24px 16px 40px;text-align:center;color:var(--muted);font-size:12px}
  /* sheet */
  .mask{position:fixed;inset:0;background:rgba(20,20,30,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
  .mask.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:560px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;
         max-height:90vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom)}
  .sheet.show{transform:translateY(0)}
  .sheet .art{aspect-ratio:400/220;position:relative}
  .sheet .art svg{width:100%;height:100%;display:block;border-radius:20px 20px 0 0}
  .sheet .close{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px;line-height:34px;cursor:pointer}
  .sheet .grab{position:absolute;left:50%;top:7px;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:rgba(255,255,255,.75)}
  .sheet .in{padding:14px 18px 22px}
  .sheet h2{margin:0;font-size:20px}
  .sheet .vn{color:var(--muted);font-size:13px}
  .sheet p{margin:10px 0}
  .sheet dl{margin:12px 0;background:var(--bg);border-radius:12px;padding:8px 12px;font-size:13.5px}
  .sheet dl div{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .sheet dl div:last-child{border-bottom:0}
  .sheet dt{flex:0 0 64px;color:var(--muted)}
  .sheet dd{margin:0;flex:1}
  .sheet .tip{background:#FFF6E0;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0}
  .sheet .tip b{color:#8A5A00}
  .btns{display:flex;gap:8px;margin-top:14px}
  .btns a{flex:1;text-align:center;text-decoration:none;border-radius:12px;padding:10px 6px;font-weight:600;font-size:14px}
  .btns a.map{background:var(--red);color:#fff}
  .btns a.pic{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
  body.lock{overflow:hidden}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <svg class="deco" viewBox="0 0 100 100"><path d="M10 80 L30 30 L40 55 L55 15 L70 50 L80 35 L95 80Z" fill="#fff"/><circle cx="78" cy="18" r="9" fill="#fff"/></svg>
    <h1>河內跨年自由行</h1>
    <div class="sub">2026/12/31（四）– 2027/1/4（一）・5 天 4 夜</div>
    <div class="count" id="countdown"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
  <footer>點選每個行程可查看介紹、地圖與照片<br>插畫為示意圖・票價、營業時間以現場公告為準</footer>
</div>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script>
/* ============ 插畫 ============ */
const P={sky:'#CFE8F3',water:'#7FBFD6',red:'#C0392B',gold:'#E8B04B',cream:'#F7EEDD',dark:'#2E3440',green:'#5C8D6E',
  night:'#1E2B4A',roof:'#8E3B2E',wall:'#F2D49B',grey:'#9AA4AE',leaf:'#4E8A5B'};
const R=(x,y,w,h,c,o='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" ${o}/>`;
const bg=c=>R(0,0,400,240,c);
const cloud=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})" fill="#fff" opacity=".92"><ellipse rx="28" ry="11"/><ellipse cx="16" cy="-8" rx="17" ry="12"/><ellipse cx="-12" cy="-5" rx="13" ry="9"/></g>`;
const star=(cx,cy,r,c)=>{let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.42:r;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return `<polygon points="${p.join(' ')}" fill="${c}"/>`};
const tree=(x,y,s=1,c=P.leaf)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-3" y="0" width="6" height="22" fill="#6B4F3A"/><circle cy="-6" r="16" fill="${c}"/><circle cx="-11" cy="2" r="11" fill="${c}"/><circle cx="11" cy="2" r="11" fill="${c}"/></g>`;
const roof=(x,y,w,c=P.roof)=>`<path d="M${x-10} ${y} Q${x+w/2} ${y-6} ${x+w+10} ${y} L${x+w+16} ${y-8} Q${x+w/2} ${y-28} ${x-16} ${y-8}Z" fill="${c}"/>`;
const karst=(x,b,w,h,c)=>`<path d="M${x} ${b} C${x+w*.05} ${b-h*.6} ${x+w*.2} ${b-h} ${x+w*.45} ${b-h} C${x+w*.7} ${b-h} ${x+w*.8} ${b-h*.55} ${x+w} ${b}Z" fill="${c}"/>`;
const waves=(y,c='#fff')=>`<g stroke="${c}" stroke-width="2" opacity=".5" fill="none"><path d="M30 ${y} q10 -5 20 0 t20 0"/><path d="M250 ${y+14} q10 -5 20 0 t20 0"/><path d="M140 ${y+28} q10 -5 20 0 t20 0"/></g>`;
const steam=(x,y)=>`<g stroke="#fff" stroke-width="3" fill="none" opacity=".7" stroke-linecap="round"><path d="M${x} ${y} q-8 -12 0 -24 t0 -24"/><path d="M${x+22} ${y} q-8 -12 0 -24 t0 -24"/><path d="M${x+44} ${y} q-8 -12 0 -24 t0 -24"/></g>`;
const nightSky=()=>{let s=bg(P.night);for(let i=0;i<26;i++){s+=`<circle cx="${(i*73)%400}" cy="${(i*37)%120}" r="${i%3?1:1.6}" fill="#fff" opacity=".7"/>`}return s};

const ART={
plane:()=>bg('#BFE1F2')+cloud(80,60,1.2)+cloud(320,170,1)+cloud(330,50,.7)+
 `<g transform="translate(200 125) rotate(-10)"><path d="M-20 0 L-48 -58 L-30 -58 L22 0Z" fill="#DDE3EA"/><ellipse rx="98" ry="15" fill="#fff"/><path d="M-20 4 L-42 52 L-25 52 L16 4Z" fill="#CFD7E0"/><path d="M-86 -4 L-102 -40 L-88 -40 L-66 -4Z" fill="${P.red}"/><rect x="-60" y="-1" width="140" height="4" fill="${P.red}" opacity=".85"/>${[...Array(9)].map((_,i)=>`<circle cx="${-45+i*13}" cy="-6" r="2.6" fill="#5B7A99"/>`).join('')}<path d="M80 -8 q14 4 16 8 q-2 4 -16 8z" fill="#5B7A99"/></g>`,
lounge:()=>bg('#E9E2D6')+`<rect x="60" y="30" width="170" height="180" rx="80" fill="#C9D3DC"/><rect x="74" y="44" width="142" height="152" rx="70" fill="#BFE1F2"/>`+cloud(130,110,1)+cloud(170,160,.7)+R(250,150,130,90,'#A47551')+`<path d="M285 120 h50 v28 a25 18 0 0 1 -50 0z" fill="#fff"/><path d="M335 128 a10 10 0 0 1 0 18" stroke="#fff" stroke-width="5" fill="none"/><ellipse cx="310" cy="122" rx="25" ry="5" fill="#6B3F1F"/>`+steam(292,110),
car:()=>bg('#F4D9B8')+R(0,170,400,70,'#5E6470')+`<g fill="#fff" opacity=".8">${[0,1,2,3,4].map(i=>`<rect x="${10+i*85}" y="203" width="45" height="5" rx="2"/>`).join('')}</g><g transform="translate(80 92)"><path d="M10 78 V40 Q12 10 50 8 H200 Q232 8 240 40 V78Z" fill="#F7F7F7"/><path d="M60 18 H195 Q215 18 222 42 H60Z" fill="#9CC3DA"/><path d="M22 42 Q26 20 50 18 V42Z" fill="#9CC3DA"/><rect x="10" y="56" width="230" height="6" fill="${P.red}"/><circle cx="60" cy="80" r="17" fill="#2E3440"/><circle cx="60" cy="80" r="7" fill="#aaa"/><circle cx="195" cy="80" r="17" fill="#2E3440"/><circle cx="195" cy="80" r="7" fill="#aaa"/></g>`,
hotel:()=>bg('#F2C9A0')+`<circle cx="320" cy="70" r="30" fill="#F7E08A"/>`+R(0,200,400,40,'#7C8A7A')+`<rect x="120" y="30" width="160" height="175" fill="#3D4A5C"/>${[...Array(8)].map((_,r)=>[...Array(5)].map((_,c)=>`<rect x="${135+c*29}" y="${45+r*19}" width="18" height="11" fill="${(r*5+c)%3?'#F6D57B':'#5A6B80'}"/>`).join('')).join('')}<rect x="180" y="185" width="40" height="20" fill="#F6D57B"/>`+R(40,120,70,85,'#56657A')+R(300,140,70,65,'#56657A')+tree(70,190,.8)+tree(340,192,.7),
pool:()=>bg('#BFE1F2')+cloud(90,50)+R(0,150,400,90,'#E9E2D6')+`<path d="M0 150 L60 110 L90 120 L130 95 L170 118 L210 100 L260 120 L300 92 L340 115 L400 105 V150Z" fill="#9AA9B8"/><rect x="40" y="168" width="250" height="52" rx="6" fill="#3FA7D6"/><g stroke="#fff" stroke-width="2" opacity=".6"><path d="M60 185 q12 -6 24 0 t24 0"/><path d="M160 200 q12 -6 24 0 t24 0"/></g><g transform="translate(305 175)"><path d="M0 30 L60 30 L70 8" stroke="#fff" stroke-width="6" fill="none"/><path d="M30 -40 v70" stroke="#6B4F3A" stroke-width="3"/><path d="M-5 -38 Q30 -62 65 -38Z" fill="${P.red}"/></g>`,
visa:()=>bg('#E8F0EA')+`<g transform="translate(95 40) rotate(-8)"><rect width="120" height="165" rx="10" fill="#2F5E4A"/><circle cx="60" cy="70" r="26" fill="none" stroke="${P.gold}" stroke-width="3"/><rect x="25" y="120" width="70" height="6" fill="${P.gold}"/><rect x="35" y="132" width="50" height="5" fill="${P.gold}"/></g><g transform="translate(195 50) rotate(6)"><rect width="135" height="160" rx="8" fill="#fff" stroke="#D5DBE1"/>${[0,1,2,3,4].map(i=>`<rect x="18" y="${30+i*18}" width="${i%2?70:98}" height="6" rx="3" fill="#D5DBE1"/>`).join('')}<g transform="translate(88 125) rotate(-14)"><rect x="-38" y="-17" width="76" height="34" rx="6" fill="none" stroke="${P.red}" stroke-width="3"/><text x="0" y="7" font-size="18" font-weight="700" fill="${P.red}" text-anchor="middle" font-family="sans-serif">VISA</text></g></g>`,
sim:()=>bg('#EDE7F6')+`<rect x="140" y="30" width="120" height="190" rx="18" fill="#2E3440"/><rect x="150" y="48" width="100" height="154" rx="6" fill="#BFE1F2"/>${[0,1,2,3].map(i=>`<rect x="${170+i*16}" y="${150-i*18}" width="11" height="${20+i*18}" rx="2" fill="${P.red}"/>`).join('')}<g transform="translate(275 120) rotate(12)"><path d="M0 0 h50 l14 14 v60 h-64z" fill="${P.gold}"/><rect x="12" y="24" width="40" height="34" rx="4" fill="#D69A1E"/></g>`,
temple:()=>bg('#CFE8F3')+cloud(70,45)+R(0,170,400,70,P.green)+`<rect x="40" y="185" width="320" height="45" rx="20" fill="${P.water}"/><g><rect x="135" y="112" width="130" height="60" fill="#E9D8B8"/>${[0,1,2,3].map(i=>`<rect x="${143+i*34}" y="112" width="14" height="60" fill="#D7BE92"/>`).join('')}${roof(150,112,100)}<rect x="160" y="62" width="80" height="44" fill="${P.red}"/><circle cx="200" cy="84" r="15" fill="${P.gold}"/>${[...Array(8)].map((_,i)=>`<path d="M200 84 L${(200+15*Math.cos(i*Math.PI/4)).toFixed(1)} ${(84+15*Math.sin(i*Math.PI/4)).toFixed(1)}" stroke="${P.red}" stroke-width="2"/>`).join('')}${roof(165,64,70)}</g>`+tree(60,150,1.1)+tree(345,150,1),
museum:()=>bg('#D8ECF5')+R(0,190,400,50,'#8FB08F')+`<rect x="70" y="95" width="260" height="100" fill="#F2D27E"/><path d="M60 98 L200 50 L340 98Z" fill="${P.roof}"/>${[0,1,2,3,4,5,6].map(i=>`<rect x="${88+i*35}" y="112" width="18" height="30" rx="9" fill="#fff"/><rect x="${88+i*35}" y="152" width="18" height="30" rx="9" fill="#fff"/>`).join('')}<rect x="186" y="160" width="28" height="35" fill="#8E5A2B"/>`+tree(40,175,.9)+tree(365,178,.9),
coffee:()=>bg('#4F6B4A')+R(0,175,400,65,'#8B6A47')+`<g opacity=".25" fill="#fff"><rect x="30" y="30" width="80" height="50"/><rect x="290" y="40" width="80" height="60"/></g>${star(70,55,16,'#E8B04B')}<g transform="translate(140 70)"><path d="M10 30 h100 l-10 90 a12 12 0 0 1 -12 10 h-56 a12 12 0 0 1 -12 -10z" fill="#F4EBD8"/><path d="M14 40 h92 l-3 25 h-86z" fill="#fff"/><path d="M20 65 h80 l-7 55 h-66z" fill="#7A4A26"/><path d="M110 50 a20 20 0 0 1 0 40" stroke="#F4EBD8" stroke-width="8" fill="none"/></g>`+R(110,200,180,8,'#6B5137'),
flagtower:()=>bg('#CFE8F3')+cloud(320,60)+R(0,200,400,40,'#8FB08F')+`<path d="M100 205 h200 l-12 -30 h-176z" fill="#B9A487"/><path d="M125 175 h150 l-10 -24 h-130z" fill="#C8B496"/><path d="M148 151 h104 l-8 -20 h-88z" fill="#D7C4A5"/><path d="M178 131 h44 l-6 -82 h-32z" fill="#C8B496"/>${[0,1,2,3].map(i=>`<rect x="${192}" y="${60+i*18}" width="16" height="7" fill="#8C7A60"/>`).join('')}<rect x="180" y="40" width="40" height="12" fill="#B9A487"/><rect x="198" y="5" width="4" height="38" fill="#555"/><rect x="202" y="7" width="52" height="34" fill="#DA251D"/>${star(228,24,11,'#FFDD00')}`,
citadel:()=>bg('#CFE8F3')+cloud(90,40)+R(0,195,400,45,'#8FB08F')+`<rect x="40" y="115" width="320" height="85" fill="#D9C7A3"/>${[0,1,2,3,4].map(i=>`<path d="M${70+i*56} 200 v-40 a14 14 0 0 1 28 0 v40z" fill="#5A4A3A"/>`).join('')}<rect x="40" y="110" width="320" height="10" fill="#C2AE88"/><rect x="130" y="72" width="140" height="38" fill="${P.red}"/>${[0,1,2,3,4].map(i=>`<rect x="${138+i*28}" y="76" width="14" height="30" fill="#F2D49B"/>`).join('')}${roof(135,74,130)}${roof(160,45,80)}<rect x="170" y="45" width="60" height="4" fill="${P.red}"/>`,

/* ============ 畫面 ============ */
const ST={ok:['ok','已預訂'],tbd:['tbd','待確認'],todo:['todo','待辦']};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let current='prep';

function renderTabs(){
  document.getElementById('tabs').innerHTML=DAYS.map(d=>`<button data-id="${d.id}" class="${d.id===current?'on':''}"><b>${d.tab}</b><small>${d.small}</small></button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.id));
}
function chips(it){
  let s='';
  if(it.cost) s+=`<span class="chip cost">💰 ${esc(it.cost)}</span>`;
  if(ST[it.st]) s+=`<span class="chip ${ST[it.st][0]}">${ST[it.st][1]}</span>`;
  return s?`<div class="chips">${s}</div>`:'';
}
function renderDay(d){
  let h=`<section class="hero"><div class="art">${art(d.art)}</div><div class="txt"><h2>${esc(d.title)}</h2><p>${esc(d.desc)}</p>${d.stay?`<div class="stay">${esc(d.stay)}</div>`:''}</div></section>`;
  if(d.prep) return h+renderPrep();
  h+=`<div class="sec">行程（點選查看介紹）</div><ul class="tl">`;
  d.items.forEach((it,i)=>{
    h+=`<li><div class="time">${esc(it.t)}${it.sm?`<small>${esc(it.sm)}</small>`:''}</div>
      <button class="item" data-i="${i}"><div class="body"><h3>${esc(it.title)}</h3><div class="vn">${esc(it.sub||'')}</div>${chips(it)}</div><div class="thumb">${art(it.art)}</div></button></li>`;
  });
  return h+'</ul>';
}
function load(){try{return JSON.parse(localStorage.getItem('hanoi-checks')||'{}')}catch(e){return {}}}
function save(o){try{localStorage.setItem('hanoi-checks',JSON.stringify(o))}catch(e){}}
function renderPrep(){
  const done=load();
  let h=`<div class="sec">待辦清單</div><div class="card">`+PREP.checks.map(([k,t,s])=>`<div class="check"><input type="checkbox" id="c-${k}" data-k="${k}" ${done[k]?'checked':''}><label for="c-${k}">${esc(t)}${s?`<small>${esc(s)}</small>`:''}</label></div>`).join('')+`</div><p class="note">勾選狀態只存在你自己的手機瀏覽器，旅伴看不到。</p>`;
  h+=`<div class="sec">已訂項目與費用</div><div class="card"><table class="cost">`+PREP.costs.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')+`</table></div>`;
  h+=`<div class="sec">住宿與實用資訊</div><div class="card"><table class="cost">`+PREP.notes.map(([a,b])=>`<tr><td><b>${esc(a)}</b><br><span style="font-weight:400;color:#555">${esc(b)}</span></td><td></td></tr>`).join('')+`</table></div>`;
  return h;
}
function go(id){
  current=id; renderTabs();
  const d=DAYS.find(x=>x.id===id);
  const v=document.getElementById('view'); v.innerHTML=renderDay(d);
  v.querySelectorAll('.item').forEach(b=>b.onclick=()=>openSheet(d.items[+b.dataset.i]));
  v.querySelectorAll('.check input').forEach(c=>c.onchange=()=>{const o=load();o[c.dataset.k]=c.checked;save(o)});
  if(location.hash!=='#'+id) history.replaceState(null,'','#'+id);
  window.scrollTo({top:0});
  const tb=document.querySelector('#tabs .on'); if(tb) tb.scrollIntoView({inline:'center',block:'nearest'});
}
function openSheet(it){
  const q=encodeURIComponent(it.q||it.sub||it.title);
  const sh=document.getElementById('sheet');
  sh.innerHTML=`<div class="art">${art(it.art)}<span class="grab"></span><button class="close" aria-label="關閉">×</button></div>
   <div class="in"><h2>${esc(it.title)}</h2><div class="vn">🕒 ${esc(it.t)}${it.sm?' '+esc(it.sm):''}${it.sub?'　'+esc(it.sub):''}</div>${chips(it)}
   ${(it.desc||[]).map(p=>`<p>${esc(p)}</p>`).join('')}
   ${it.info?`<dl>${it.info.map(([a,b])=>`<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl>`:''}
   ${it.tips?`<div class="tip"><b>小提醒：</b>${esc(it.tips)}</div>`:''}
   ${it.q?`<div class="btns"><a class="map" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">📍 Google 地圖</a><a class="pic" href="https://www.google.com/search?tbm=isch&q=${q}" target="_blank" rel="noopener">🖼 看實景照片</a></div>`:''}
   </div>`;
  sh.querySelector('.close').onclick=closeSheet;
  sh.scrollTop=0;
  document.getElementById('mask').classList.add('show'); sh.classList.add('show'); document.body.classList.add('lock');
}
function closeSheet(){document.getElementById('mask').classList.remove('show');document.getElementById('sheet').classList.remove('show');document.body.classList.remove('lock')}
document.getElementById('mask').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* 倒數 */
(function(){
  const dep=new Date('2026-12-31T08:15:00+08:00'), back=new Date('2027-01-04T21:10:00+08:00'), now=new Date();
  const days=Math.ceil((dep-now)/86400000), el=document.getElementById('countdown');
  el.textContent= now<dep ? `✈️ 距離出發還有 ${days} 天` : now<back ? '🇻🇳 旅行進行中！' : '📷 旅行結束，謝謝大家！';
})();

window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==current&&DAYS.some(d=>d.id===h)){closeSheet();go(h)}});
const start=(location.hash||'').slice(1);
go(DAYS.some(d=>d.id===start)?start:'prep');
</script>
